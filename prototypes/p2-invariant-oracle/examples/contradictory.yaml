# Same migration model as consistent.yaml, but a second developer added an
# invariant for "zero-downtime rolling deploy" that directly contradicts the
# existing version-skew bound: they want >=2 versions running concurrently
# to avoid a request gap, not realizing the migration invariants already
# cap skew at 1. This is a realistic way contradictions sneak in when
# invariants are authored independently by different people.

variables:
  phase:
    type: enum
    values: [expand, backfill, contract, done]
  column_state:
    type: enum
    values: [absent, write_only, present, delete_only]
  version_skew:
    type: int
    min: 0
    max: 3
  old_running:
    type: bool
  new_running:
    type: bool
  reads_absent_column:
    type: bool

invariants:
  - name: inv_skew_bound
    description: >-
      At most one version of app code (old vs. new) may run concurrently
      during any migration phase.
    formula: "version_skew <= 1"

  - name: inv_no_read_absent
    description: >-
      No API request may read the migrated column while its schema state
      is absent.
    formula: "not (reads_absent_column and column_state == \"absent\")"

  - name: inv_expand_state
    description: >-
      During the expand phase the new column exists and is written by new
      code only (write-only); it is not yet safe to read.
    formula: "implies(phase == \"expand\", column_state == \"write_only\")"

  - name: inv_backfill_state
    description: >-
      During backfill the column is write-only until the backfill job
      finishes, after which it is present (fully readable).
    formula: >-
      implies(phase == "backfill", column_state == "write_only" or
      column_state == "present")

  - name: inv_contract_state
    description: >-
      During contract the old data path is being removed; the column is
      treated as delete-only (being dropped, not written by new code).
    formula: "implies(phase == \"contract\", column_state == \"delete_only\")"

  - name: inv_contract_needs_no_old
    description: >-
      Contract may only begin once no instance of the old app version is
      still running (guards against removing state the old code depends on).
    formula: "implies(phase == \"contract\", not old_running)"

  - name: inv_done_state
    description: >-
      Once the migration is done, the old column is fully absent.
    formula: "implies(phase == \"done\", column_state == \"absent\")"

  - name: inv_skew_at_least_two
    description: >-
      During a rolling deploy at least two app versions must be able to run
      concurrently so there is never a request-serving gap.
    formula: "version_skew >= 2"
