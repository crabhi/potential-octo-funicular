# The FROZEN gate for Relay, direction 1: what must never / must always
# happen, quantified over EVERY situation the rules allow; and direction 2:
# what must remain possible. Each property names its ticket. Agents editing
# rules.yaml answer to this file pinned (--gate). Note that five of these
# S-properties protect containments that have NO deny rule — the allows
# are tight and default-deny does the work; the property proves it stays
# that way under any future edit.

safety:
  - id: S1_org_isolation
    description: "HD-1: customers never act outside their own org."
    requires: 'implies(actor.role == "customer", resource.same_org)'

  - id: S2_public_locked_out
    description: "HD-1: the public sees nothing, ever."
    requires: 'actor.role != "anonymous"'

  - id: S3_inactive_locked
    description: "Deactivated accounts can do nothing."
    requires: 'actor.active'

  - id: S4_nothing_deleted
    description: "HD-6: deletion is not a feature (no deny rule — proven
      by tight allows + default deny)."
    requires: 'action != "delete"'

  - id: S5_subject_required
    description: "HD-2: no case is opened without a subject."
    requires: 'implies(action == "open", resource.has_subject)'

  - id: S6_staff_states_are_staff_only
    description: "HD-3: only staff triage, hold, resolve or close."
    requires: 'implies(action in ["triage", "wait", "resolve", "close"],
                       actor.role in ["agent", "lead"])'

  - id: S7_resolver_is_assignee_or_lead
    description: "HD-4: resolution comes from the assignee or a lead."
    requires: 'implies(action == "resolve",
                       resource.mine or actor.role == "lead")'

  - id: S8_breach_escalates
    description: "HD-5: a breached case is resolved by a lead only."
    requires: 'implies(action == "resolve" and resource.sla_breached,
                       actor.role == "lead")'

  - id: S9_sealed_after_resolution
    description: "HD-2/6: resolved and closed cases are not editable."
    requires: 'implies(resource.state in ["resolved", "closed"],
                       action != "edit")'

  - id: S10_closed_is_a_record
    description: "HD-6: a closed case admits reading and nothing else."
    requires: 'implies(resource.state == "closed", action == "read")'

  - id: S11_only_leads_close
    description: "HD-6: closing is the QA step, and it is a lead's."
    requires: 'implies(action == "close", actor.role == "lead")'

  - id: S12_staff_never_reopen
    description: "HD-4: the requester's side decides — staff and bots
      never reopen."
    requires: 'implies(action == "reopen", actor.role == "customer")'

  - id: S13_mailbot_contained
    description: "HD-7: the robot opens and files replies; a leaked
      credential can do nothing else."
    requires: 'implies(actor.role == "mailbot", action in ["open", "reply"])'

  # ==== HD-8/9: the thread and the evidence (entity-tagged, like rules).
  # Each child property quantifies over the child's WHOLE situation space,
  # parent context included — "for every parent state a rule could see".

  - id: S14_threads_follow_org_walls
    entity: comment
    description: "HD-1/8: customers never touch another org's thread."
    requires: 'implies(actor.role == "customer", parent.same_org)'

  - id: S15_internal_stays_inside
    entity: comment
    description: "HD-8: no action on an internal note is ever granted to
      anyone but staff — reading included."
    requires: 'implies(resource.has_internal, actor.role in ["agent", "lead"])'

  - id: S16_closed_seals_the_thread
    entity: comment
    description: "HD-8/6: on a closed case the thread admits reading and
      nothing else."
    requires: 'implies(parent.state == "closed", action == "read")'

  - id: S17_comments_immutable
    entity: comment
    description: "HD-8: what was said is what was said — comments are
      never edited or deleted (no deny rule: tight allows + default
      deny, proven here)."
    requires: 'action not in ["edit", "delete"]'

  - id: S18_only_leads_redact
    entity: comment
    description: "HD-8: redaction is a lead's call."
    requires: 'implies(action == "redact", actor.role == "lead")'

  - id: S19_mailbot_writes_only
    entity: comment
    description: "HD-7/8: the robot posts email bodies; it never reads
      the thread back, never redacts, never edits."
    requires: 'implies(actor.role == "mailbot", action == "post")'

  - id: S20_public_locked_out_of_threads
    entity: comment
    description: "HD-1: the public sees no thread, ever."
    requires: 'actor.role != "anonymous"'

  - id: S21_evidence_follows_org_walls
    entity: attachment
    description: "HD-1/9: customers never touch another org's evidence."
    requires: 'implies(actor.role == "customer", parent.same_org)'

  - id: S22_evidence_only_while_working
    entity: attachment
    description: "HD-9: new evidence lands only on a case being worked."
    requires: 'implies(action == "attach",
                       parent.state in ["new", "open", "waiting"])'

  - id: S23_attachments_never_deleted
    entity: attachment
    description: "HD-6/9: removal is a tombstone; deletion and editing do
      not exist (no deny rule — proven)."
    requires: 'action not in ["edit", "delete"]'

  - id: S24_removal_is_author_or_lead
    entity: attachment
    description: "HD-9: only the uploader or a lead removes evidence."
    requires: 'implies(action == "remove",
                       actor.is_author or actor.role == "lead")'

  - id: S25_closed_seals_the_evidence
    entity: attachment
    description: "HD-9/6: on a closed case the evidence admits reading
      and nothing else."
    requires: 'implies(parent.state == "closed", action == "read")'

  - id: S26_mailbot_attaches_only
    entity: attachment
    description: "HD-7/9: the robot files email attachments and can do
      nothing else to evidence."
    requires: 'implies(actor.role == "mailbot", action == "attach")'

  - id: S27_public_locked_out_of_evidence
    entity: attachment
    description: "HD-1: the public sees no evidence, ever."
    requires: 'actor.role != "anonymous"'

  # S3 again, once per child — pinned mechanically because the extension
  # default (untagged rules apply to the ROOT only) fails OPEN for global
  # denies: an untagged deny_inactive would have let a deactivated account
  # post comments, and only these properties would have caught it.
  - id: S28_inactive_locked_out_of_threads
    entity: comment
    description: "Deactivated accounts can do nothing to a thread."
    requires: 'actor.active'

  - id: S29_inactive_locked_out_of_evidence
    entity: attachment
    description: "Deactivated accounts can do nothing to evidence."
    requires: 'actor.active'

possibility:
  - id: P1_customers_open
    description: "HD-2: a customer can open a case in their org."
    witness: 'actor.role == "customer" and action == "open"
              and resource.same_org and resource.has_subject'

  - id: P2_agents_triage
    description: "HD-3: an agent can triage a new case."
    witness: 'actor.role == "agent" and action == "triage"'

  - id: P3_assignee_resolves
    description: "HD-4: the assigned agent can resolve in time."
    witness: 'actor.role == "agent" and action == "resolve"
              and resource.mine and not resource.sla_breached'

  - id: P4_leads_resolve_breaches
    description: "HD-5: a lead can resolve a breached case — breaches
      are recoverable, not stuck."
    witness: 'actor.role == "lead" and action == "resolve"
              and resource.sla_breached'

  - id: P5_customers_reply
    description: "HD-3: a customer reply can pull a case off hold."
    witness: 'actor.role == "customer" and action == "reply"
              and resource.same_org'

  - id: P6_customers_reopen
    description: "HD-4: a customer can dispute a resolution."
    witness: 'actor.role == "customer" and action == "reopen"
              and resource.same_org'

  - id: P7_leads_close
    description: "HD-6: the record can actually be sealed."
    witness: 'actor.role == "lead" and action == "close"'

  - id: P8_mailbot_opens
    description: "HD-7: the robot can file inbound email."
    witness: 'actor.role == "mailbot" and action == "open"
              and resource.has_subject'

  - id: P9_staff_cross_org
    description: "HD-1: staff serve every org (no org attribute: staff
      is outside every wall)."
    witness: 'actor.role == "agent" and action == "read"
              and not resource.same_org'

  - id: P10_customers_discuss
    entity: comment
    description: "HD-8: a customer can post to their org's thread."
    witness: 'actor.role == "customer" and action == "post"
              and parent.same_org and resource.has_body'

  - id: P11_staff_note_internally
    entity: comment
    description: "HD-8: staff can talk shop inside the thread."
    witness: 'actor.role == "agent" and action == "post"
              and resource.has_internal'

  - id: P12_leads_redact
    entity: comment
    description: "HD-8: redaction is actually possible."
    witness: 'actor.role == "lead" and action == "redact"'

  - id: P13_thread_outlives_closure
    entity: comment
    description: "HD-8/6: the thread of a CLOSED case is still readable —
      sealing is not erasure; the thread is the record."
    witness: 'action == "read" and parent.state == "closed"'

  - id: P14_mailbot_files_bodies
    entity: comment
    description: "HD-7/8: the robot can file an email body."
    witness: 'actor.role == "mailbot" and action == "post"
              and resource.has_body'

  - id: P15_customers_attach
    entity: attachment
    description: "HD-9: a customer can attach evidence to their org's
      working case."
    witness: 'actor.role == "customer" and action == "attach"
              and parent.same_org and resource.has_filename'

  - id: P16_authors_remove
    entity: attachment
    description: "HD-9: an ordinary agent can remove their own mistaken
      upload — no lead required."
    witness: 'actor.role == "agent" and action == "remove"
              and actor.is_author'

# HD-6's structural half: resolved may only ever be reached by resolving,
# closed only by closing — no future transition may sneak into either.
# Child states get the same treatment: redacted only by redacting,
# removed only by removing.
lifecycle:
  only_into:
    resolved: [resolve]
    closed: [close]
    comment.redacted: [redact]
    attachment.removed: [remove]
