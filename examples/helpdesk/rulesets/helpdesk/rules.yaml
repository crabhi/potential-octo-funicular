# Relay — a customer-support helpdesk, as one rule base.
# The interaction logic of the whole product: see ../../TICKETS.md for the
# seven tickets this file translates; every rule names its ticket. Executed
# and analyzed by the generic engine in ../../../rule-driven-cms/ — the app
# on top (../../app.py) talks to it only through engine.kernel.

entity: case

roles: [anonymous, customer, agent, lead, mailbot]

states: [new, open, waiting, resolved, closed]

# The situation space is a budget: every boolean doubles it. Only `subject`
# needs a has_ boolean (HD-2); the rest opt out.
fields:
  - subject
  - {name: org, has: false}
  - {name: assignee, has: false}
  - {name: severity, has: false}
  - {name: sla_due, has: false}

actor_fields: [org]

projections:
  - {name: mine, kind: actor_matches_field, actor_attr: name, field: assignee}
  - {name: same_org, kind: actor_matches_field, actor_attr: org, field: org}
  - {name: sla_breached, kind: date_passed, field: sla_due}

lifecycle:
  transitions:
    - {action: open,    from: none,     to: new}
    - {action: triage,  from: new,      to: open}
    - {action: wait,    from: open,     to: waiting}
    - {action: reply,   from: waiting,  to: open}
    - {action: resolve, from: open,     to: resolved}
    - {action: reopen,  from: resolved, to: open}
    - {action: close,   from: resolved, to: closed}

# HD-8/9: the thread and the evidence are their own entity types, ruled in
# the same rule base. Their `context:` imports are the ONLY window onto the
# parent case — parent.state and parent.same_org enter each child's
# vocabulary, so "a closed case seals its thread" is a rule, not UI code,
# and the kernel joins the live case row into every decision.
children:
  - entity: comment
    states: [posted, redacted]
    fields: [body, internal]        # has_body: HD-8; has_internal: staff-only
    context: [state, same_org]
    lifecycle:
      transitions:
        - {action: post,   from: none,   to: posted}
        - {action: redact, from: posted, to: redacted}

  - entity: attachment
    states: [attached, removed]
    fields: [filename]
    context: [state, same_org]
    lifecycle:
      transitions:
        - {action: attach, from: none,     to: attached}
        - {action: remove, from: attached, to: removed}

assumptions:
  - id: a_anonymous_is_active
    description: "Anonymous visitors have no account to deactivate."
    holds: 'implies(actor.role == "anonymous", actor.active)'

# Containment note (the note-14 lesson, applied up front this time): there
# are NO deny rules for "customers never triage", "staff never reopen",
# "only leads close", "nothing is deleted", "the mailbot does nothing
# else". The allows below are tight and silence means deny; writing those
# denies would make them provably DEAD rules. The gate's S-properties
# (S4, S6, S11, S12, S13) prove each containment universally instead.
# Cost of that choice: those refusals surface as `default_deny`, not as a
# named stakeholder sentence — see DEVLOG on this tension.

rules:
  # ---- denies ----
  - id: deny_inactive
    description: "A deactivated account can do nothing at all."
    entity: [case, comment, attachment]
    effect: deny
    when: 'not actor.active'

  - id: org_walls
    description: "HD-1: customers see and touch only their own
      organization's cases — reading included, and a case can never be
      moved into or out of an organization by its customers."
    effect: deny
    when: 'actor.role == "customer" and not resource.same_org'

  - id: case_needs_subject
    description: "HD-2: no case without a subject — a subjectless case
      cannot be triaged, routed or reported on."
    effect: deny
    when: 'action == "open" and not resource.has_subject'

  - id: only_assignee_resolves
    description: "HD-4: a case is resolved by the agent it is assigned
      to; only a lead may resolve someone else's case."
    effect: deny
    when: 'action == "resolve" and not resource.mine and actor.role != "lead"'

  - id: breach_needs_lead
    description: "HD-5: once the SLA is breached, an ordinary agent may
      no longer resolve the case — every breach gets senior eyes."
    effect: deny
    when: 'action == "resolve" and resource.sla_breached
           and actor.role != "lead"'

  - id: sealed_after_resolution
    description: "HD-2 + HD-6: a resolved or closed case is no longer
      editable, by anyone — reopen it (customers) or live with the
      record."
    effect: deny
    when: 'resource.state in ["resolved", "closed"] and action == "edit"'

  # ---- allows ----
  - id: customer_opens
    description: "HD-2: customers open cases (into their own org —
      org_walls holds them to it)."
    effect: allow
    when: 'actor.role == "customer" and action == "open"'

  - id: customer_follows
    description: "HD-1: everyone in the customer org follows the org's
      cases."
    effect: allow
    when: 'actor.role == "customer" and action == "read"'

  - id: customer_edits
    description: "HD-2: customers maintain their org's cases while they
      are being worked (the resolution seal carves out the rest)."
    effect: allow
    when: 'actor.role == "customer" and action == "edit"'

  - id: customer_replies
    description: "HD-3: a customer reply pulls a waiting case back into
      the working queue."
    effect: allow
    when: 'actor.role == "customer" and action == "reply"'

  - id: customer_reopens
    description: "HD-4: the requester's side decides whether it is
      fixed — customers reopen resolved cases."
    effect: allow
    when: 'actor.role == "customer" and action == "reopen"'

  - id: staff_serve
    description: "HD-3: staff work every org's cases: read, edit, open
      (a case taken by phone), triage, put on hold, resolve — with the
      assignee and SLA denies above carving the sharp edges."
    effect: allow
    when: 'actor.role in ["agent", "lead"]
           and action in ["read", "edit", "open", "triage", "wait", "resolve"]'

  - id: lead_closes
    description: "HD-6: closing is the QA step, and it is a lead's."
    effect: allow
    when: 'actor.role == "lead" and action == "close"'

  - id: mailbot_files
    description: "HD-7: the mail robot opens cases from inbound email and
      files customer replies — its entire blast radius."
    effect: allow
    when: 'actor.role == "mailbot" and action in ["open", "reply"]'

  # ==== HD-8/9: the thread and the evidence (child entities) ====
  # The containment note above holds here too: no "comments are never
  # edited", "nothing in the thread is deleted", "only leads redact",
  # "the robot never reads" denies — the allows below are tight, silence
  # denies, and gate properties S17/S18/S19/S23/S24/S26 prove each
  # containment universally.

  # ---- denies ----
  - id: org_walls_thread
    description: "HD-1 via HD-8/9: the org wall extends to a case's thread
      and evidence — the PARENT case's org decides, and the kernel joins
      it in; a customer never touches another org's discussion."
    entity: [comment, attachment]
    effect: deny
    when: 'actor.role == "customer" and not parent.same_org'

  - id: sealed_thread
    description: "HD-8/9 + HD-6: a closed case seals its thread and its
      evidence — nothing new is said, redacted, attached or removed; the
      record stays readable forever."
    entity: [comment, attachment]
    effect: deny
    when: 'parent.state == "closed" and action != "read"'

  - id: comment_needs_body
    description: "HD-8: a comment needs a body."
    entity: comment
    effect: deny
    when: 'action == "post" and not resource.has_body'

  - id: internal_is_staff_only
    description: "HD-8: internal notes never reach customers or the robot
      — not readable, not postable, not anything."
    entity: comment
    effect: deny
    when: 'resource.has_internal and actor.role not in ["agent", "lead"]'

  - id: fresh_evidence_only
    description: "HD-9: a resolved or closed case takes no new evidence —
      dispute the resolution first."
    entity: attachment
    effect: deny
    when: 'action == "attach" and parent.state in ["resolved", "closed"]'

  - id: attachment_needs_file
    description: "HD-9: an attachment needs a filename."
    entity: attachment
    effect: deny
    when: 'action == "attach" and not resource.has_filename'

  # ---- allows ----
  - id: customer_discusses
    description: "HD-8: customers read and join their org's case threads
      (the org wall and the internal-note screen carve the rest)."
    entity: comment
    effect: allow
    when: 'actor.role == "customer" and action in ["read", "post"]'

  - id: staff_discuss
    description: "HD-8: staff read and join every thread, internal notes
      included."
    entity: comment
    effect: allow
    when: 'actor.role in ["agent", "lead"] and action in ["read", "post"]'

  - id: lead_redacts
    description: "HD-8: if something must disappear, a lead redacts it —
      and the redaction stays on the record."
    entity: comment
    effect: allow
    when: 'actor.role == "lead" and action == "redact"'

  - id: mailbot_files_mail
    description: "HD-8: the robot files inbound email bodies as comments —
      it never reads the thread back."
    entity: comment
    effect: allow
    when: 'actor.role == "mailbot" and action == "post"'

  - id: customer_attaches
    description: "HD-9: customers read and add their org's evidence."
    entity: attachment
    effect: allow
    when: 'actor.role == "customer" and action in ["read", "attach"]'

  - id: staff_attach
    description: "HD-9: staff read and add evidence on every case."
    entity: attachment
    effect: allow
    when: 'actor.role in ["agent", "lead"] and action in ["read", "attach"]'

  - id: author_removes
    description: "HD-9: a mistaken upload is removed by the person who
      attached it (removal keeps the tombstone)."
    entity: attachment
    effect: allow
    when: 'actor.is_author and action == "remove"
           and actor.role in ["customer", "agent", "lead"]'

  - id: lead_removes
    description: "HD-9: a lead removes anyone's mistaken upload."
    entity: attachment
    effect: allow
    when: 'actor.role == "lead" and action == "remove"'

  - id: mailbot_attaches
    description: "HD-9: the robot files email attachments — and never
      removes or reads anything."
    entity: attachment
    effect: allow
    when: 'actor.role == "mailbot" and action == "attach"'
