# A second, unrelated service — support tickets — running on the SAME
# generic engine and analyzer as the CMS. Nothing in engine/ or analysis/
# changes: the rule base is the program.

entity: ticket

roles: [anonymous, customer, agent, admin]

states: [open, closed]

fields: [subject]

lifecycle:
  transitions:
    - {action: create, from: none,   to: open}
    - {action: close,  from: open,   to: closed}
    - {action: reopen, from: closed, to: open}

assumptions:
  - id: a_requesters_have_accounts
    description: "Tickets are always authored by a signed-in requester."
    holds: 'implies(actor.is_author, actor.role in ["customer", "agent", "admin"])'
  - id: a_anonymous_is_active
    description: "Anonymous visitors have no account to deactivate."
    holds: 'implies(actor.role == "anonymous", actor.active)'

rules:
  - id: deny_inactive
    description: "A deactivated account may not do anything."
    effect: deny
    when: 'not actor.active'

  - id: closed_is_frozen
    description: "A closed ticket cannot be edited by anyone; reopen it
      first."
    effect: deny
    when: 'resource.state == "closed" and action == "edit"'

  - id: customer_create
    description: "Customers may open tickets."
    effect: allow
    when: 'actor.role == "customer" and action == "create"'

  - id: requester_reads_own
    description: "The requester may always read their own ticket."
    effect: allow
    when: 'actor.is_author and action == "read"'

  - id: requester_manages_open
    description: "While their ticket is open, the requester may edit or
      delete it."
    effect: allow
    when: 'actor.is_author and resource.state == "open"
           and action in ["edit", "delete"]'

  - id: agent_works_tickets
    description: "Agents may read, edit, close, and reopen any ticket."
    effect: allow
    when: 'actor.role == "agent"
           and action in ["read", "edit", "close", "reopen"]'

  - id: admin_all
    description: "Admins may do anything not denied above."
    effect: allow
    when: 'actor.role == "admin"'
